[package]
name = "audio-compare"
version = "0.1.0"
description = "Open A/B and blind ABX listening tests for lossless vs lossy audio"
authors = ["Kelvin O. Lim"]
edition = "2021"

[lib]
name = "audio_compare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
rand = "0.8"
chrono = { version = "0.4", features = ["serde", "clock"] }
which = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
